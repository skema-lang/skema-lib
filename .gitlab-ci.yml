## skema-lib — GitLab CI/CD
##
## This repo is a plain npm workspace of publishable libraries, so the pipeline
## is correspondingly small: build (which type-checks), audit, and — on a tag —
## push every workspace package to this project's npm Package Registry.
##
## Pipeline sources: merge requests, the default branch, and tags.
## - MRs / default branch : build + audit
## - tags (vX.Y.Z)        : additionally publish the packages
##
## The tag is the single source of truth for the version. `check-release`
## refuses to publish unless every workspace manifest already carries the
## version the tag names, the same bargain skema's `publish-npm-model` makes
## with Cargo.toml. Cutting a release is therefore: bump the version in each
## package.json, commit, `git tag vX.Y.Z && git push origin main vX.Y.Z`.
##
## Unlike skema, nothing here tags itself and nothing downstream is triggered.
## skema-editor and skema-vscode still consume this repo by path
## (`file:../skema-lib/diagram`); when they move to registry versions they need
## the same `@skema` scope line this repo's .npmrc carries.
##
## Prerequisites in the GitLab project settings:
##   - Package registry enabled (Settings → General → Visibility → Packages).
##     It is on by default; the publish job 403s without it.
##   - Nothing else. `CI_JOB_TOKEN` may publish to its own project's registry
##     out of the box, so there is no token to create or rotate here.
##
## `@skema/model` reached the registry with skema's v0.1.4 tag; 0.1.0…0.1.3
## were tagged but never published, so 0.1.4 is the oldest version that exists
## and `^0.1.2` resolves to it. The lockfile was written while nothing was
## published and therefore had no entry for the package at all, which is a
## sync error for `npm ci`, not a resolution one — after a publish in the other
## repo, `npm install` has to run here once and the lockfile be committed.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - build
  - check
  - publish

default:
  image: node:22-alpine
  # A superseded pipeline on the same branch has nothing left to say.
  interruptible: true

variables:
  # Inside the project directory so GitLab's cache can actually pick it up;
  # $HOME is not preserved between jobs.
  npm_config_cache: ${CI_PROJECT_DIR}/.npm

# Keyed by the lockfile: the same dependency set reuses the cache, and a
# changed lockfile starts a fresh one instead of layering onto a stale tree.
.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm
  policy: pull-push

# The `@skema` scope resolves from the group endpoint (see .npmrc). Both
# projects are public, so this is anonymous today and the token is pure
# insurance against one of them going private later — at which point the
# *other* project also has to allow this one under Settings → CI/CD → Job
# token permissions, or the install 404s.
.npm_auth: &npm_auth
  - |
    cat >> "$HOME/.npmrc" <<EOF
    //${CI_SERVER_HOST}/api/v4/groups/141817046/-/packages/npm/:_authToken=${CI_JOB_TOKEN}
    EOF

# --------------------------------------------------------------------------
# build
# --------------------------------------------------------------------------

# There is no separate typecheck job on purpose: each package's build is
# `tsc -p tsconfig.build.json`, which extends the very tsconfig.json that
# `npm run typecheck` uses and covers the same `src`. Running both would buy
# a second copy of the same errors.
build:
  stage: build
  cache: *npm_cache
  before_script: *npm_auth
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run build
  artifacts:
    paths:
      # One per workspace; `files` in each package.json ships exactly this, so
      # the publish job needs nothing else from here.
      - "*/dist"
    expire_in: 1 week

# --------------------------------------------------------------------------
# check
# --------------------------------------------------------------------------

audit:
  stage: check
  cache: *npm_cache
  needs: []
  before_script: *npm_auth
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm audit --audit-level=high
  # Advisory, not a gate: a transitive advisory with no fixed version available
  # should show up in the pipeline without blocking a release of libraries that
  # ship type declarations and a render layer.
  allow_failure: true

# --------------------------------------------------------------------------
# publish (tags only)
# --------------------------------------------------------------------------

# Pushes every workspace package to this project's npm registry.
#
# No `npm ci` here: none of the packages define a prepare/prepack script, so
# publishing reads the manifests and the `dist/` artifacts from `build` and
# never needs an installed tree. That also keeps the one irreversible job in
# the pipeline independent of whether a registry happens to be reachable.
publish:
  stage: publish
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # Before anything is uploaded: the tag must match every manifest's version,
    # and every publishConfig must name this project. npm has no un-publish
    # worth the name, so a wrong version is not a failed job — it is a bad
    # release that consumers can already install.
    - node scripts/check-release.mjs "$CI_COMMIT_TAG"
    # Written to $HOME rather than appended to the repo's .npmrc so the token
    # never lands in a tracked file. npm matches it to
    # `publishConfig.registry` by URL prefix.
    - |
      cat >> "$HOME/.npmrc" <<EOF
      //${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}
      EOF
    # The scope registry, not publishConfig, is what npm publishes a scoped
    # package to (see .npmrc), and the repo's own .npmrc beats anything this
    # job could write to $HOME — so the destination is repeated on the command
    # line, where it finally outranks both. check-release.mjs has already
    # established that every manifest names this same URL.
    - npm publish --workspaces "--@skema:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
