spec:
  inputs:
    skema_lang_version:
      type: string
      default: ""
      description: "skema-lang release to build and publish @skema/model/@skema/wasm from"
      regex: '^(v\d+\.\d+\.\d+(-rc\.\d+)?)?$'
    trigger_downstream:
      type: boolean
      default: true
      description: "Whether to hand released/published versions down to skema-editor and skema-vscode"
    republish_version:
      type: string
      default: ""
      regex: '^(v\d+\.\d+\.\d+(-rc\.\d+)?)?$'
      description: "Existing own-release vX.Y.Z(-rc.N) to re-run the publish steps for"

---

## skema-lib — GitLab CI/CD
##
## Two independent paths share this pipeline:
## - own release: @skema/diagram, @skema/docs, @skema/collab-protocol, one
##   version, through the skema-ci component below;
## - language pipeline (skema_lang_version input): publishes @skema/model and
##   @skema/wasm at skema-lang's version and hands it down. It never commits
##   or releases a skema-lib version of its own.
##
## Release design: see CLAUDE.md, "Releasing — the chain", and
## brain/release-chain.md.
##
## Prerequisites in the GitLab project settings:
##   - Package registry enabled.
##   - Settings → CI/CD → Job token permissions → Allow Git push requests to
##     the repository (the release job pushes the version bump, tag and
##     GitLab Release).
##   - Job token allowlist: allow skema-language/skema to trigger this
##     project; skema-editor and skema-vscode must each allow
##     skema-language/skema-lib in their own allowlist.

include:
  - component: $CI_SERVER_FQDN/skema-language/skema-ci/release@0.1.8
    inputs:
      version_file_kind: npm-workspaces
      version_file_paths: "diagram/package.json docs/package.json collab-protocol/package.json package-lock.json"
      version_file_workspaces: "diagram docs collab-protocol"
      publish_hook: >-
        echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> "${CI_PROJECT_DIR}/.npmrc" &&
        publish-npm.mjs diagram docs collab-protocol
      dependants: "skema-language/skema-editor,skema-language/skema-vscode"
      handoff_input_name: skema_lib_version
      version_stage: version
      release_stage: release
      handoff_stage: handoff
      adopt_stage: check
      trigger_downstream: $[[ inputs.trigger_downstream ]]
      republish_version: $[[ inputs.republish_version ]]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - check
  - version
  - build
  - release
  - publish
  - verify
  - handoff

default:
  image: node:22-alpine
  # A superseded pipeline on the same branch has nothing left to say.
  interruptible: true

variables:
  # Inside the project directory so GitLab's cache can actually pick it up;
  # $CI_PROJECT_DIR, not $HOME: GitLab expands the value before the shell
  # sees it, and $HOME is not a CI variable - it expands to nothing.
  npm_config_cache: ${CI_PROJECT_DIR}/.npm

# Pinned to the same version as the component include above - bump both
# together. Only jobs that call a skema-ci script directly (not through the
# component) need this image explicitly.
.skema_ci_image: &skema_ci_image
  image: "registry.gitlab.com/skema-language/skema-ci:0.1.5"

# Keyed by the lockfile: the same dependency set reuses the cache, and a
# changed lockfile starts a fresh one instead of layering onto a stale tree.
.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm
  policy: pull-push

# Insurance for the day a project in the group goes private; anonymous today.
.npm_auth: &npm_auth
  - |
    cat >> "${CI_PROJECT_DIR}/.npmrc" <<EOF
    //${CI_SERVER_HOST}/api/v4/groups/141817046/-/packages/npm/:_authToken=${CI_JOB_TOKEN}
    EOF

# A language input never releases a skema-lib version of its own: added to
# every component job's rules below ahead of its own branch condition. Skips
# the component's `adopt_triggered_rule` clause too - moot here, since this
# repo's include never sets `adopt_groups`.
.skip_with_language_input: &skip_with_language_input
  if: '"$[[ inputs.skema_lang_version ]]" != ""'
  when: never

# --------------------------------------------------------------------------
# build / check (own release)
# --------------------------------------------------------------------------

# There is no separate typecheck job on purpose: each package's build is
# `tsc -p tsconfig.build.json`, which extends the very tsconfig.json that
# `npm run typecheck` uses and covers the same `src`.
build:
  stage: build
  cache: *npm_cache
  needs:
    - job: version
      artifacts: true
      optional: true
  rules:
    - *skip_with_language_input
    - when: on_success
  before_script: *npm_auth
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run build
  artifacts:
    paths:
      # One per workspace; `files` in each package.json ships exactly this.
      - "*/dist"
    expire_in: 1 week

audit:
  stage: check
  cache: *npm_cache
  needs: []
  rules:
    - *skip_with_language_input
    - when: on_success
  before_script: *npm_auth
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm audit --audit-level=high
  # Advisory, not a gate.
  allow_failure: true

# --------------------------------------------------------------------------
# release (skema-ci component job, extended)
# --------------------------------------------------------------------------

# Every component job below is extended the same way: its own rules alone
# would still fire on a language-input pipeline (also `development`), so
# `.skip_with_language_input` is prepended. `release` also gets `build`'s
# artifacts added to its needs - the component only knows about `version`'s
# patched manifests, but the publish hook packs `*/dist`.
version:
  rules:
    - *skip_with_language_input
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "development"'

release:
  needs:
    - job: version
      artifacts: true
    - job: build
      artifacts: true
  rules:
    - *skip_with_language_input
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "development"'

promote-mr:
  rules:
    - *skip_with_language_input
    - if: '$CI_COMMIT_BRANCH == "development"'

back-merge:
  rules:
    - *skip_with_language_input
    - if: '$CI_COMMIT_BRANCH == "main"'

handoff:
  rules:
    - *skip_with_language_input
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "development"'

# --------------------------------------------------------------------------
# language pipeline (skema_lang_version input)
# --------------------------------------------------------------------------

publish-language-packages:
  <<: *skema_ci_image
  stage: publish
  interruptible: false
  needs: []
  rules:
    - if: '"$[[ inputs.skema_lang_version ]]" != ""'
  variables:
    SKEMA_LANG_VERSION: $[[ inputs.skema_lang_version ]]
  before_script:
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> "${CI_PROJECT_DIR}/.npmrc"
  script:
    - node wasm-packaging/scripts/fetch-artifact.mjs "$SKEMA_LANG_VERSION"
    - node wasm-packaging/scripts/build-model-package.mjs "$SKEMA_LANG_VERSION"
    - node wasm-packaging/scripts/build-wasm-package.mjs "$SKEMA_LANG_VERSION"
    # Model first: @skema/wasm pins it exactly. publish-npm.mjs tags a
    # prerelease `rc` and only a final moves `latest`, per package.
    - publish-npm.mjs wasm-packaging/npm/model wasm-packaging/npm/wasm

# @skema/diagram and @skema/docs take @skema/model as a peer without an upper
# bound, so a new language version is where an incompatible model shows up.
check-model:
  stage: verify
  cache: *npm_cache
  needs:
    - publish-language-packages
  rules:
    - if: '"$[[ inputs.skema_lang_version ]]" != ""'
  variables:
    SKEMA_LANG_VERSION: $[[ inputs.skema_lang_version ]]
  before_script: *npm_auth
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    # Set in the workspaces' own manifests: installed at the root instead, their
    # exact devDependency keeps the old model in reach of tsc.
    - npm pkg set "devDependencies.@skema/model=${SKEMA_LANG_VERSION#v}" --workspace diagram --workspace docs
    - npm install --prefer-online --no-audit --fund=false
    - npm run build

# A separate pair from the component's own `handoff`/`trigger-downstream`:
# those hand down `skema_lib_version` from a real release, this hands down
# `skema_lang_version` from a language input, to the same two dependants.
# `handoff_input_name` is one static string per component include, so the two
# input names can't share that job - the shape below is JSON (JSON is YAML),
# the same one skema-ci's own handoff job writes.
handoff-language:
  stage: handoff
  needs:
    - publish-language-packages
    - check-model
  rules:
    - if: '"$[[ inputs.skema_lang_version ]]" != ""'
  variables:
    SKEMA_LANG_VERSION: $[[ inputs.skema_lang_version ]]
    TRIGGER_DOWNSTREAM: $[[ inputs.trigger_downstream ]]
  script:
    - |
      if [ "$TRIGGER_DOWNSTREAM" != "true" ]; then
        # An empty child config is refused outright ("File `handoff.yml` is
        # empty!"), and trigger-language's rules were evaluated before this
        # job ran, so it cannot be skipped from here.
        echo "handoff-language: trigger_downstream is false, nothing to hand down."
        cat > handoff.yml <<'EOF'
      no-handoff:
        stage: handoff
        image: alpine:latest
        script:
          - echo "nothing to hand down"
      EOF
        exit 0
      fi
      cat > handoff.yml <<EOF
      {
        "skema-editor": {"trigger": {"project": "skema-language/skema-editor", "branch": "development", "strategy": "mirror", "inputs": {"skema_lang_version": "$SKEMA_LANG_VERSION", "trigger_downstream": $TRIGGER_DOWNSTREAM}}},
        "skema-vscode": {"trigger": {"project": "skema-language/skema-vscode", "branch": "development", "strategy": "mirror", "inputs": {"skema_lang_version": "$SKEMA_LANG_VERSION", "trigger_downstream": $TRIGGER_DOWNSTREAM}}}
      }
      EOF
  artifacts:
    paths:
      - handoff.yml
    expire_in: 1 day

trigger-language:
  stage: handoff
  needs:
    - job: handoff-language
      artifacts: true
  rules:
    - if: '"$[[ inputs.skema_lang_version ]]" != ""'
  trigger:
    include:
      - artifact: handoff.yml
        job: handoff-language
    strategy: mirror
